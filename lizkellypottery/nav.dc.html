<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };

  componentDidMount() {
    this.check = () => this.setState({ isMobile: window.innerWidth < 1080 });
    this.check();
    window.addEventListener('resize', this.check);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.check);
  }

  renderVals() {
    const current = this.props.currentPage ?? 'home';
    const items = [
      { key: 'home', label: 'Home', href: 'index.html' },
      { key: 'shop', label: 'Shop', href: 'Shop.html' },
      { key: 'about', label: 'About', href: 'About.html' },
      { key: 'gallery', label: 'Gallery', href: 'Gallery.html' },
      { key: 'stockists', label: 'Stockists', href: 'Stockists.html' },
      { key: 'reviews', label: 'Reviews', href: 'Reviews.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.html' },
    ];
    const phone = this.props.phone ?? '(919) 656-6099';
    return {
      navItems: items,
      showDesktop: !this.state.isMobile,
      showMobile: this.state.isMobile,
      menuOpen: this.state.isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      phone,
      phoneTel: phone.replace(/[^\d+]/g, ''),
