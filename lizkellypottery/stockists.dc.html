<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Stockists — Liz Kelly Pottery</title>
<meta name="description" content="Find Liz Kelly Pottery in shops and restaurants around Raleigh and North Carolina.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23a8674b'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Georgia,serif' fill='white' text-anchor='middle'%3ELK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:oklch(0.97 0.015 90); }
  a { color: oklch(0.64 0.12 40); }
  a:hover { color: oklch(0.52 0.12 40); }
</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#e8ded2"/><text x="200" y="210" font-size="140" font-family="Georgia,serif" fill="#a8674b" text-anchor="middle">LK</text></svg></template>
</helmet>

<dc-import name="nav" current-page="stockists" hint-size="100%,72px"></dc-import>

<main style="font-family:'Work Sans',sans-serif;color:oklch(0.24 0.02 50);">
  <section style="max-width:1100px;margin:0 auto;padding:clamp(36px,6vw,64px) clamp(16px,4vw,32px) clamp(20px,3vw,32px);">
    <div style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:oklch(0.52 0.12 40);margin-bottom:12px;">Stockists</div>
    <h1 style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(34px,5vw,52px);margin:0 0 16px;">Find our wares in person.</h1>
    <p style="font-size:16px;line-height:1.65;color:oklch(0.42 0.02 50);max-width:60ch;margin:0;">Liz Kelly Pottery is carried by shops, galleries, and restaurants across North Carolina.</p>
  </section>

  <section style="max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,32px) clamp(24px,4vw,40px);">
    <h2 style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.52 0.12 40);margin:0 0 18px;">Retailers &amp; Galleries</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;">
      <sc-for list="{{ retailers }}" as="shop" hint-placeholder-count="5">
        <a href="{{ shop.url }}" style="text-decoration:none;color:inherit;display:block;background:oklch(0.99 0.008 90);border:1px solid oklch(0.9 0.015 85);border-radius:16px;padding:22px;">
          <div style="font-weight:700;font-size:16px;margin-bottom:6px;color:oklch(0.52 0.12 40);">{{ shop.name }}</div>
          <div style="font-size:14px;color:oklch(0.42 0.02 50);line-height:1.6;">{{ shop.address }}</div>
          <sc-if value="{{ shop.phone }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:14px;color:oklch(0.42 0.02 50);margin-top:4px;">{{ shop.phone }}</div>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,32px) clamp(56px,8vw,80px);">
    <h2 style="font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.52 0.12 40);margin:0 0 18px;">Wares In Use At</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;">
      <sc-for list="{{ inUse }}" as="shop" hint-placeholder-count="3">
        <a href="{{ shop.url }}" style="text-decoration:none;color:inherit;display:block;background:oklch(0.99 0.008 90);border:1px solid oklch(0.9 0.015 85);border-radius:16px;padding:22px;font-weight:700;font-size:16px;color:oklch(0.52 0.12 40);">{{ shop.name }}</a>
      </sc-for>
    </div>
  </section>
</main>

<dc-import name="footer" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>

  renderVals() {
    return {

        { name: 'Edge of Urge (Wilmington)', address: '18 Market St, Wilmington, NC 28401', phone: '(910) 762-1662', url: 'https://edgeofurge.com/' },

        { name: 'The Shoppe At Scroggs Farm', address: '191 Dog Branch Rd, Brasstown, NC 28902', phone: '(828) 557-2174', url: 'https://www.scroggsfarm.com' },

</script>
</body>
</html>
